[callcentrum]
; --- INTERNÍ VOLÁNÍ MEZI KLAPKAMI (PRO TEST) ---
exten => _10X,1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()
exten => _20X,1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

; --- HLOUBKA IVR 0: PŘÍMÝ VSTUP DO FRONTY ---
exten => 501,1,Answer()
 same => n,Queue(fronta_ringall)
 same => n,Hangup()

exten => 502,1,Answer()
 same => n,Queue(fronta_leastrecent)
 same => n,Hangup()

exten => 503,1,Answer()
 same => n,Queue(fronta_fewestcalls)
 same => n,Hangup()

; --- HLOUBKA IVR 1: JEDNOÚROVŇOVÉ MENU ---
exten => 600,1,Answer()
 same => n,Goto(ivr-uroven1,s,1)

; --- HLOUBKA IVR 2: DVOUÚROVŇOVÉ MENU ---
exten => 700,1,Answer()
 same => n,Goto(ivr-hlavni,s,1)

[ivr-hlavni]
exten => s,1,Background(beep)
 same => n,WaitExten(5)
exten => 1,1,Goto(ivr-uroven1,s,1)
exten => t,1,Goto(s,1)
exten => i,1,Goto(s,1)

[ivr-uroven1]
exten => s,1,Background(beep)
 same => n,WaitExten(5)
exten => 1,1,Queue(fronta_ringall)
 same => n,Hangup()
exten => 2,1,Queue(fronta_leastrecent)
 same => n,Hangup()
exten => 3,1,Queue(fronta_fewestcalls)
 same => n,Hangup()
exten => t,1,Goto(s,1)
exten => i,1,Goto(s,1)
