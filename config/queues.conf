[general]
persistentmembers = yes
autofill = yes

; --- ŠABLONA FRONTY ---
[fronta-zaklad](!)
musicclass = default
timeout = 5
retry = 1
maxlen = 0
ringinuse = no
joinempty = yes
leavewhenempty = no
; Staticky přiřazení agenti
member => PJSIP/101
member => PJSIP/102
member => PJSIP/103

; --- 3 STRATEGIE PRO MĚŘENÍ ---
[fronta_ringall](fronta-zaklad)
strategy = ringall

[fronta_leastrecent](fronta-zaklad)
strategy = leastrecent

[fronta_fewestcalls](fronta-zaklad)
strategy = fewestcalls
